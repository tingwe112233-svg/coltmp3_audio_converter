name: coltmp3_audio_converter
description: Aplikasi Android Native Pemutar & Konverter Audio Lokal MP3 CBR 44.1kHz untuk kompatibilitas tape mobil.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Fork FFmpegKit aktif yang di-host resmi di Maven Central
  ffmpeg_kit_flutter_new_audio: ^2.5.0

  just_audio: ^0.9.40
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

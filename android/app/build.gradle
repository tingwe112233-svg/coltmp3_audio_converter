plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.coltaudio.mp3converter"
    // SEBELUMNYA 34, DIUBAH MENJADI 35 SESUAI PERMINTAAN LOG
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.coltaudio.mp3converter"
        // minSdk 24 dibutuhkan oleh ffmpeg_kit_flutter_audio (Android 7.0+)
        minSdk = 24
        // SEBELUMNYA 34, DIUBAH MENJADI 35
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}
